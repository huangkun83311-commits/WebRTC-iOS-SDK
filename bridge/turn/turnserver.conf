# coturn 配置 —— 给 WebRTC 做 NAT 穿透
# 部署：docker compose up -d
# 必须放行：3478/tcp+udp（STUN/TURN）、5349/tcp+udp（TLS）、49160-49200/udp（中继端口）

listening-port=3478
tls-listening-port=5349

# 换成你服务器的公网 IP；既要有公网 IP 又要有内网网卡时，external-ip 写成 "公网IP/内网IP"
external-ip=YOUR_PUBLIC_IP

# 中继端口范围，必须和 docker-compose 里映射的一致
min-port=49160
max-port=49200

# 临时凭据（推荐）：浏览器每次用 HMAC 现算用户名密码，过期即失效
use-auth-secret
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET

# 长期凭据（简单但会泄露）：两种方式二选一
# lt-cred-mech
# user=akun:CHANGE_ME_PASSWORD
# realm=akun.local

# 只允许你的域名/IP 使用，防止被人白嫖带宽
# allowed-peer-ip=内网网段

fingerprint
no-multicast-peers
no-cli
no-loopback-peers

# 日志
log-file=/var/log/turnserver.log
simple-log
verbose

# TLS 证书（可选，但 wss 走 TLS 时更稳）；不配就用明文 turn:
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem
