<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AKUN Device Bridge - 控制台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1216; color: #e6e9ef; font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft Yahei", sans-serif; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #161b22; border-bottom: 1px solid #232a34; position: sticky; top: 0; z-index: 9; }
  .bar input { background: #0f1216; border: 1px solid #2b333f; color: #e6e9ef; padding: 6px 9px; border-radius: 6px; width: 170px; }
  .bar button { background: #2563eb; border: 0; color: #fff; padding: 7px 14px; border-radius: 6px; cursor: pointer; }
  .bar button.ghost { background: #21262d; border: 1px solid #2b333f; }
  .bar button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 12px; color: #8b949e; margin-left: auto; display: flex; gap: 14px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f85149; margin-right: 5px; vertical-align: 1px; }
  .dot.on { background: #3fb950; }
  .stage { display: flex; justify-content: center; align-items: flex-start; padding: 18px; }
  .screen { position: relative; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.6); max-width: 100%; }
  video { display: block; width: 100%; height: auto; }
  /* 直绘通道：WebCodecs 解出来的帧直接画在 canvas 上，不进 <video> 的抖动缓冲 */
  #rawCanvas { display: none; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 130px); }
  .stage.is-idle .screen { width: 360px; height: 640px; display: grid; place-items: center; }
  .stage.is-idle video, .stage.is-idle #rawCanvas { display: none; }
  /* 画面到齐后把"未连接"这句话彻底拿掉，否则它会在视频下面多占一行，看着像画面没铺满 */
  .stage:not(.is-idle) .hint { display: none; }
  .hint { color: #6e7681; font-size: 12px; }
  #peers { color: #8b949e; font-size: 12px; }
  .ver{font-size:11px;color:#889;margin-left:8px}
  /* 数据面板：排障时要一眼看出卡在哪一段（网络？解码？缓冲？还是链路本身） */
  #hud{position:fixed;right:14px;top:58px;width:268px;background:rgba(13,17,23,.94);border:1px solid #2b333f;
       border-radius:10px;padding:10px 12px;font:12px/1.7 ui-monospace,Consolas,monospace;z-index:20;
       box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #hud.hide{display:none}
  #hud h4{margin:0 0 6px;font:600 12px/1.4 -apple-system,"Microsoft Yahei",sans-serif;color:#8b949e;letter-spacing:.5px}
  #hud .row{display:flex;justify-content:space-between;gap:8px}
  #hud .row span:first-child{color:#7d8590}
  #hud .v{color:#e6e9ef;font-weight:600}
  #hud .bad{color:#f85149}
  #hud .ok{color:#3fb950}
  #hud .warn{color:#d29922}
  #hud hr{border:0;border-top:1px solid #21262d;margin:7px 0}
  #hud .tap{color:#8b949e}
  #hud .tap b{color:#58a6ff}
  /* 辅助功能面板：对标 AKUN 的 19940 动作集，但走我们自己的 WS 通道 */
  #aux{position:fixed;left:14px;bottom:14px;width:340px;max-height:62vh;overflow:auto;
       background:rgba(13,17,23,.95);border:1px solid #2b333f;border-radius:10px;
       padding:10px 12px;font:12px/1.6 -apple-system,"Microsoft Yahei",sans-serif;z-index:26;
       box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #aux.hide{display:none}
  #aux h4{margin:0 0 8px;font:600 12px/1.4 -apple-system,"Microsoft Yahei",sans-serif;color:#8b949e;letter-spacing:.5px}
  #aux .grp{display:flex;gap:6px;margin-bottom:7px;align-items:center}
  #aux .grp input{flex:1;min-width:0;background:#0d1117;border:1px solid #30363d;color:#e6e9ef;
       border-radius:6px;padding:4px 6px;font:12px -apple-system,"Microsoft Yahei",sans-serif}
  #aux button{background:#21262d;border:1px solid #30363d;color:#e6e9ef;border-radius:6px;
       padding:3px 8px;font:12px -apple-system,"Microsoft Yahei",sans-serif;cursor:pointer;white-space:nowrap}
  #aux button:hover{background:#30363d}
  #aux .ok{color:#3fb950}
  #aux .bad{color:#f85149}
  #aux .muted{color:#8b949e}
  #aux .out{border-top:1px solid #21262d;margin-top:6px;padding-top:6px;font:12px/1.6 ui-monospace,Consolas,monospace;
       color:#c9d1d9;max-height:34vh;overflow:auto}
  #aux .app{display:flex;justify-content:space-between;gap:6px;padding:1px 0}
  #aux .app span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="bar">
  <label>设备 ID</label>
  <input id="room" value="dev001" spellcheck="false" />
  <button id="connect">连接</button>
  <button id="disconnect" class="ghost">断开</button>
  <!-- 画质档位：默认「标准」= AKUN 出厂值 0.35 / 12fps / 1.5Mbps；
       授权给别人看用「省流」，自己中控看用「高清/超清」，切换即时生效不用重装 -->
  <select id="quality" title="画质档位（改的是设备端的 scale/fps/码率，即时生效）">
    <option value="0.35,30,700000,1200000" selected>流畅·默认 0.35 / 30fps / 0.7M（=AKUN清晰度，长跑不烫）</option>
    <option value="0.35,45,900000,1500000">更跟手（局域网）0.35 / 45fps / 0.9M</option>
    <option value="0.30,30,500000,800000">省流·授权用 0.30 / 30fps / 0.5M（字仍可读）</option>
    <option value="0.30,24,400000,600000">极省 · 多机并发 0.30 / 24fps / 0.4M</option>
    <option value="0.45,25,1200000,1800000">看字优先 0.45 / 25fps / 1.2M</option>
  </select>
  <!-- 档位自动换算：选"中控/授权"再填台数和上行总带宽，服务端按每台可用带宽算出
       cap(单台上限) / scale(分辨率) / fps，一键下发；设备重连会自动套用上次的档。 -->
  <select id="mode" title="局域网=不占外网上行的高档；巡检=几百台缩略；授权=低清档">
    <option value="lan" selected>局域网 · 高档</option>
    <option value="console">中控 · 默认档</option>
    <option value="grid">巡检 · 缩略档</option>
    <option value="auth">授权 · 低清档</option>
  </select>
  <select id="devs" title="同时连接的台数">
    <option value="1" selected>1 台</option>
    <option value="5">5 台</option>
    <option value="10">10 台</option>
    <option value="20">20 台</option>
    <option value="30">30 台</option>
  </select>
  <label title="上行总带宽（Mbps）">上行</label><input id="uplink" value="50" size="3" style="width:52px" />
  <button id="applyPreset" title="按 台数/上行 自动算出并下发档位">按档次下发</button>
  <span id="presetInfo" style="color:#8b949e;font-size:12px"></span>
  <button id="hudBtn" class="ghost" title="显示/隐藏数据面板（快捷键 D）">数据面板</button>
  <button id="auxBtn" class="ghost" title="辅助功能：文字输入 / 锁屏唤醒 / 音量亮度 / 应用启停 / 剪贴板">辅助功能</button>
  <span class="ver" title="页面版本标记：看到这个标记说明拿到的是最新页面">页v10 · 辅助功能全接</span>
  <span id="peers"></span>
  <span class="status">
    <span><span id="videoDot" class="dot"></span>画面</span>
    <span><span id="ctrlDot" class="dot"></span>控制</span>
    <span id="fps">--</span>
    <span id="stat"></span>
  </span>
</div>

<div id="hud" class="hide">
  <h4>链路数据</h4>
  <div class="row"><span>分辨率</span><span class="v" id="hRes">--</span></div>
  <div class="row"><span>收到帧率</span><span class="v" id="hFps">--</span></div>
  <div class="row"><span>码率</span><span class="v" id="hKbps">--</span></div>
  <div class="row"><span>丢包</span><span class="v" id="hLost">--</span></div>
  <div class="row"><span>抖动 jitter</span><span class="v" id="hJit">--</span></div>
  <div class="row"><span>缓冲深度</span><span class="v" id="hBuf">--</span></div>
  <div class="row"><span>解码耗时</span><span class="v" id="hDec">--</span></div>
  <div class="row"><span>丢帧/冻结</span><span class="v" id="hFreeze">--</span></div>
  <div class="row"><span>重传 NACK</span><span class="v" id="hNack">--</span></div>
  <div class="row"><span>链路 RTT</span><span class="v" id="hRtt">--</span></div>
  <hr />
  <h4>设备侧（手机发得怎么样）</h4>
  <div class="row"><span>设备 fps</span><span class="v" id="dFps">--</span></div>
  <div class="row"><span>渲染/缩图</span><span class="v" id="dRender">--</span></div>
  <div class="row"><span>编码耗时</span><span class="v" id="dEnc">--</span></div>
  <div class="row"><span>上行</span><span class="v" id="dUp">--</span></div>
  <div class="row"><span>设备档位</span><span class="v" id="dCfg">--</span></div>
  <hr />
  <h4>跟手实测（本机）</h4>
  <div class="row"><span>点击→画面变化</span><span class="v" id="hTap">--</span></div>
  <div class="row"><span>首帧耗时</span><span class="v" id="hFF">--</span></div>
  <div class="tap" id="hTapLog">按下游画面里点击一次即可测</div>
</div>

<div id="aux" class="hide">
  <h4>辅助功能 · 与 AKUN 同功能，走本机 WebRTC 控制通道</h4>
  <div class="grp">
    <input id="auxText" placeholder="要输入的文字（中文走剪贴板粘贴）" />
    <button id="auxSendText" title="写入设备剪贴板 + 键盘通道 Cmd+V 粘贴">输入</button>
  </div>
  <div class="grp">
    <input id="kbPad" placeholder="键盘直通：在这里敲字符会逐键发到手机（含 Shift 组合）" autocomplete="off" />
    <button id="kbClear" class="ghost" title="清空">清空</button>
  </div>
  <div class="grp">
    <button data-aux="lock">锁屏</button>
    <button data-aux="unlock">唤醒</button>
    <button data-aux="respring">注销</button>
    <button data-aux="go_home">回桌面</button>
    <button data-aux="device_info">设备信息</button>
  </div>
  <div class="grp">
    <button data-aux="volume_up">音量+</button>
    <button data-aux="volume_down">音量-</button>
    <button data-aux="toggle_mute">静音</button>
    <button data-aux="brightness_up">亮度+</button>
    <button data-aux="brightness_down">亮度-</button>
  </div>
  <div class="grp">
    <input id="auxTarget" placeholder="网址 或 BundleID（如 com.apple.mobilesafari）" />
    <button id="auxOpen" title="https:// 开头按打开网址处理，否则按 BundleID 启动">打开</button>
  </div>
  <div class="grp">
    <button onclick="__auxKey('enter')" title="发送回车键">回车</button>
    <button onclick="__auxKey('backspace')" title="发送退格键">退格</button>
    <button onclick="__auxKey('escape')" title="发送 Esc">Esc</button>
    <button onclick="__auxKey('up')" title="方向键上">↑</button>
    <button onclick="__auxKey('down')" title="方向键下">↓</button>
    <button onclick="__auxKey('left')" title="方向键左">←</button>
    <button onclick="__auxKey('right')" title="方向键右">→</button>
  </div>
  <div class="grp">
    <button id="auxApps" title="列出已安装应用">应用列表</button>
    <button id="auxClip" title="读设备剪贴板">取剪贴板</button>
    <button id="auxClose" class="ghost">收起</button>
  </div>
  <div class="out" id="auxOut">--</div>
</div>

<div class="stage is-idle" id="stage">
  <div class="screen" id="screen">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="rawCanvas"></canvas>
    <span class="hint">未连接</span>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), screenEl = $('screen'), video = $('video');

  let videoWs = null, ctrlWs = null, pc = null, videoRetry = null, pingTimer = null;
  let lastMoveSent = 0;

  const WS_BASE = (function () {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return proto + '//' + location.host;
  })();
  // 授权码：URL 里的 ?k= 原样透传给两条 WS（服务端 -key 模式校验）；必须定义在顶层，
  // 否则 startVideo/startControl 引用不到（之前插进 connect 回调里，点了连接直接 ReferenceError）
  const AUTH_K = new URLSearchParams(location.search).get('k') || '';

  function setDot(el, on) { el.classList.toggle('on', !!on); }

  function log() { console.log('[bridge]', ...arguments); }

  /* ================= 直绘通道：H.264 over WebSocket（真点对点） =================
     为什么要这条：WebRTC 的媒体是 UDP，公网下必须有一方能被对方打进来；这条
     宽带上浏览器的 ICE 打不进来，只能退回服务器中继（每多看一路就多一份带宽）。
     WebSocket 是 TCP，天生能钻进 frp xtcp 已经打通的洞 —— 媒体也变成点对点，
     服务器一个字节都不转。代价是 TCP 队头阻塞，弱网偶发停顿。 */
  const RAW = {
    ws: null, dec: null, cv: null, cx: null, room: '',
    au: [], auTs: -1, auIdr: false, fuParts: null,
    sps: null, pps: null, codec: '', cfgd: false,
    seq: -1, drop: 0, got: 0, w: 0, h: 0,
    tsOut: 0, fpsT: 0, fpsN: 0, fps: 0,
    decSum: 0, decN: 0, decMs: 0,
    timer: null, keyTimer: null, lastFrame: 0, txBytes: 0,
  };

  function rawUseCodec(fmtp) {
    const m = /profile-level-id=([0-9a-fA-F]{6})/.exec(fmtp || '');
    const codec = m ? ('avc1.' + m[1].toUpperCase()) : 'avc1.42E034';
    if (RAW.dec && RAW.cfgd && RAW.codec === codec) return;
    if (RAW.dec) { try { RAW.dec.close(); } catch (e) {} }
    RAW.codec = codec;
    RAW.sps = null; RAW.pps = null; RAW.cfgd = false;
    RAW.dec = new VideoDecoder({
      output: rawOnFrame,
      error: (e) => { log('raw decoder error', e.message); RAW.cfgd = false; },
    });
    RAW.dec.configure({ codec: codec, optimizeForLatency: true, avc: { format: 'annexb' } });
    RAW.cfgd = true;
    log('直绘 codec', codec);
  }

  function rawOnFrame(frame) {
    const w = frame.displayWidth || frame.codedWidth;
    const h = frame.displayHeight || frame.codedHeight;
    if (RAW.cv.width !== w || RAW.cv.height !== h) {
      RAW.cv.width = w; RAW.cv.height = h;
      RAW.w = w; RAW.h = h;
    }
    try { RAW.cx.drawImage(frame, 0, 0, w, h); } catch (e) {}
    frame.close();
    RAW.got++;
    RAW.fpsN++;
    RAW.lastFrame = performance.now();
    if (RAW.cv.style.display !== 'block') {
      RAW.cv.style.display = 'block';
      video.style.display = 'none';
      stage.classList.remove('is-idle');
      setDot($('videoDot'), true);
    }
  }

  function rawAddNALU(nalu) {
    const t = nalu[0] & 0x1f;
    if (t === 7) { RAW.sps = nalu.slice(); return; }
    if (t === 8) { RAW.pps = nalu.slice(); return; }
    if (t === 5) RAW.auIdr = true;
    RAW.au.push(nalu);
  }

  function rawFlushAU() {
    const au = RAW.au;
    RAW.au = [];
    if (!au.length || !RAW.cfgd || !RAW.dec) return;
    const parts = [];
    // IDR 前面补 SPS/PPS：编码器不是每帧都带参数集，缺了 WebCodecs 会直接拒解
    if (RAW.auIdr && RAW.sps && RAW.pps) { parts.push(RAW.sps, RAW.pps); }
    for (let i = 0; i < au.length; i++) parts.push(au[i]);
    let total = 0;
    for (let i = 0; i < parts.length; i++) total += 4 + parts[i].length;
    const buf = new Uint8Array(total);
    let o = 0;
    for (let i = 0; i < parts.length; i++) {
      buf[o] = 0; buf[o + 1] = 0; buf[o + 2] = 0; buf[o + 3] = 1; o += 4;
      buf.set(parts[i], o); o += parts[i].length;
    }
    const tsUs = Math.round(RAW.auTs * 100 / 9);   // 90kHz → µs
    RAW.tsOut = tsUs > RAW.tsOut ? tsUs : RAW.tsOut + 1000;
    const t0 = performance.now();
    try {
      RAW.dec.decode(new EncodedVideoChunk({
        type: RAW.auIdr ? 'key' : 'delta',
        timestamp: RAW.tsOut,
        data: buf,
      }));
      RAW.decSum += performance.now() - t0; RAW.decN++;
      if (RAW.decN >= 30) { RAW.decMs = RAW.decSum / RAW.decN; RAW.decSum = 0; RAW.decN = 0; }
    } catch (e) {
      RAW.drop++;
      rawAskKey();
    }
    RAW.auIdr = false;
  }

  function rawAskKey() {
    if (RAW.ws && RAW.ws.readyState === 1) {
      try { RAW.ws.send(JSON.stringify({ t: 'keyframe' })); } catch (e) {}
    }
  }

  function rawOnBinary(buf) {
    const u8 = new Uint8Array(buf);
    RAW.txBytes += u8.length;
    RAW.rateBytes = (RAW.rateBytes || 0) + u8.length;
    if (u8.length < 13 || (u8[0] >> 6) !== 2) return;
    const cc = u8[0] & 0x0f;
    const hasExt = (u8[0] & 0x10) !== 0;
    let off = 12 + cc * 4;
    if (hasExt) {
      if (u8.length < off + 4) return;
      off += 4 + (((u8[off + 2] << 8) | u8[off + 3]) * 4);
    }
    if (off >= u8.length) return;
    const marker = (u8[1] & 0x80) !== 0;
    const seq = (u8[2] << 8) | u8[3];
    const ts = ((u8[4] << 24) | (u8[5] << 16) | (u8[6] << 8) | u8[7]) >>> 0;
    // 丢包就放弃当前分片和整个访问单元：残帧解出来只会花屏，等关键帧更干净
    if (RAW.seq >= 0) {
      const d = (seq - RAW.seq + 65536) % 65536;
      if (d > 1) { RAW.drop += d - 1; RAW.fuParts = null; RAW.au = []; }
    }
    RAW.seq = seq;
    const p = u8.subarray(off);
    if (ts !== RAW.auTs) {
      if (RAW.au.length) rawFlushAU();
      RAW.auTs = ts;
      RAW.auIdr = false;
    }
    const t = p[0] & 0x1f;
    if (t === 24) {                         // STAP-A：一包里塞多个 NALU
      let i = 1;
      while (i + 2 <= p.length) {
        const sz = (p[i] << 8) | p[i + 1]; i += 2;
        if (i + sz > p.length) break;
        rawAddNALU(p.subarray(i, i + sz));
        i += sz;
      }
    } else if (t === 28) {                  // FU-A：一个 NALU 被切成多包
      if (p.length < 3) return;
      const fu = p[1];
      if (fu & 0x80) { RAW.fuParts = []; }
      if (!RAW.fuParts) return;
      RAW.fuParts.push(p.subarray(2));
      if (fu & 0x40) {
        const parts = RAW.fuParts; RAW.fuParts = null;
        let len = 1;
        for (let i = 0; i < parts.length; i++) len += parts[i].length;
        const out = new Uint8Array(len);
        out[0] = (p[0] & 0xe0) | (fu & 0x1f);
        let o = 1;
        for (let i = 0; i < parts.length; i++) { out.set(parts[i], o); o += parts[i].length; }
        rawAddNALU(out);
      }
    } else if (t >= 1 && t <= 23) {          // 单包 NALU
      rawAddNALU(p);
    }
    if (marker) rawFlushAU();
  }

  function rawHudTick() {
    const now = performance.now();
    if (!RAW.fpsT) RAW.fpsT = now;
    const dt = (now - RAW.fpsT) / 1000;
    if (dt >= 0.9) { RAW.fps = Math.round(RAW.fpsN / dt); RAW.fpsN = 0; RAW.fpsT = now; }
    // 码率单独走 1 秒窗口：原来和 fps 共用分母、又每 500ms 清零，会把码率算成实际的一半
    if (!RAW.rateLast) { RAW.rateLast = now; RAW.rateBytes = 0; }
    const rdt = (now - RAW.rateLast) / 1000;
    if (rdt >= 1.0) {
      RAW.lastKbps = Math.round(RAW.rateBytes * 8 / 1000 / rdt);
      RAW.rateBytes = 0;
      RAW.rateLast = now;
    }
    const kbps = RAW.lastKbps || 0;
    setV('hRes', RAW.w && RAW.h ? (RAW.w + 'x' + RAW.h) : '--');
    setV('hFps', RAW.fps ? (RAW.fps + ' fps') : '--');
    setV('hKbps', kbps ? (kbps + ' kbps') : '--');
    setV('hJit', '0');
    setV('hBuf', RAW.got ? '0 ms（TCP 直绘）' : '--', 'ok');
    setV('hDec', RAW.decMs ? (RAW.decMs.toFixed(1) + ' ms/帧') : '--');
    setV('hFreeze', RAW.drop + ' 丢 / 0 冻', RAW.drop > 30 ? 'warn' : '');
    setV('hNack', '0 / 0');
    setV('hRtt', '直连');
  }

  function startRawVideo(room) {
    RAW.room = room;
    RAW.stopped = false;
    RAW.cv = $('rawCanvas');
    RAW.cx = RAW.cv.getContext('2d', { alpha: false, desynchronized: true });
    RAW.seq = -1; RAW.au = []; RAW.auTs = -1; RAW.auIdr = false; RAW.fuParts = null;
    RAW.drop = 0; RAW.got = 0; RAW.tsOut = 0; RAW.fpsN = 0; RAW.fpsT = 0;
    const url = WS_BASE + '/ws?room=rtp-' + encodeURIComponent(room) + '&role=raw'
      + (AUTH_K ? '&k=' + encodeURIComponent(AUTH_K) : '');
    RAW.ws = new WebSocket(url);
    RAW.ws.binaryType = 'arraybuffer';
    RAW.ws.onopen = () => {
      log('直绘通道 open');
      RAW.retry = 0;
      setDot($('videoDot'), true);
      rawAskKey();
      clearInterval(RAW.keyTimer);
      // 3 秒没新帧就再要一次关键帧（手机刚重连 / 关键帧被丢时全靠它）
      RAW.keyTimer = setInterval(() => {
        if (!RAW.got || performance.now() - RAW.lastFrame > 3000) rawAskKey();
      }, 3000);
      clearInterval(RAW.timer);
      RAW.timer = setInterval(rawHudTick, 500);
    };
    RAW.ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        try {
          const m = JSON.parse(ev.data);
          if (m && m.type === 'info') { log('直绘 info', m.fmtp); rawUseCodec(m.fmtp); }
        } catch (e) {}
        return;
      }
      rawOnBinary(ev.data);
    };
    RAW.ws.onclose = () => {
      log('直绘通道 closed');
      setDot($('videoDot'), false);
      // 断了就自己接回来：xtcp 一断一合、服务端重启都会走这里
      if (RAW.stopped || !RAW.room) return;
      RAW.retry = (RAW.retry || 0) + 1;
      const delay = Math.min(1000 * Math.pow(2, RAW.retry - 1), 5000);
      clearTimeout(RAW.rTimer);
      RAW.rTimer = setTimeout(() => {
        if (!RAW.stopped && RAW.room) {
          log('直绘通道重连 第' + RAW.retry + '次');
          startRawVideo(RAW.room);
        }
      }, delay);
    };
    RAW.ws.onerror = () => log('直绘通道 error');
  }

  function stopRawVideo() {
    RAW.stopped = true;
    clearTimeout(RAW.rTimer);
    clearInterval(RAW.timer); RAW.timer = null;
    clearInterval(RAW.keyTimer); RAW.keyTimer = null;
    if (RAW.dec) { try { RAW.dec.close(); } catch (e) {} RAW.dec = null; }
    RAW.cfgd = false; RAW.sps = null; RAW.pps = null;
    if (RAW.ws) { RAW.ws.onclose = null; try { RAW.ws.close(); } catch (e) {} RAW.ws = null; }
    if (RAW.cv) { RAW.cv.style.display = 'none'; RAW.cv.width = 0; RAW.cv.height = 0; }
    video.style.display = '';
    RAW.got = 0; RAW.w = 0; RAW.h = 0;
  }

  // 默认就走直绘（WS/TCP，真点对点）；浏览器没有 WebCodecs 时才回落 WebRTC
  function startVideoAuto(room) {
    if (typeof VideoDecoder === 'function' && !/m=rtc/.test(location.search)) {
      log('媒体走 WS 直绘（TCP 隧道，点对点）');
      startRawVideo(room);
    } else {
      log('媒体走 WebRTC（此浏览器无 WebCodecs 或被强制指定）');
      startVideo(room);
    }
  }

  /* ---------------- 视频：WebSocket 信令 + WebRTC ---------------- */
  function startVideo(room) {
    videoWs = new WebSocket(WS_BASE + '/ws?room=video-' + encodeURIComponent(room) + '&role=viewer' + (AUTH_K ? '&k=' + encodeURIComponent(AUTH_K) : ''));

    videoWs.onopen = () => {
      log('video signaling open');
      createPeerConnection();
      // 连上就发一次 offer：viewer 通常比设备晚到，收不到 _peerJoined，
      // 不发的话两边就干等（真机上表现为永远 未连接）。
      setTimeout(() => { negotiate(); }, 200);
      // 没等到 answer 就重发，设备刚上线/刚重连时很有用
      clearInterval(videoRetry);
      videoRetry = setInterval(() => {
        if (!pc || !videoWs || videoWs.readyState !== 1) return;
        if (pc.remoteDescription && pc.remoteDescription.type) return;
        if (pc.signalingState !== 'stable') return;   // 正在协商/已连上就别再插一脚
        log('offer 重发');
        negotiate();
      }, 3000);
    };

    videoWs.onmessage = async (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'answer') {
        try {
          if (pc.signalingState !== 'have-local-offer') { log('answer 忽略（状态 ' + pc.signalingState + '）'); return; }
          await pc.setRemoteDescription(m);
          await drainCandidates();
        } catch (e) {
          log('setRemoteDescription 失败：' + e.message);
        }
      } else if (m.type === 'candidate' && m.candidate) {
        if (pc.remoteDescription && pc.remoteDescription.type) {
          try { await pc.addIceCandidate(m); } catch (e) { log('addIceCandidate', e.message); }
        } else {
          pendingCandidates.push(m);
        }
      } else if (m.type === '_peerJoined') {
        log('publisher joined, renegotiating');
        if (!pc.remoteDescription) negotiate();
      } else if (m.type === '_peerLeft') {
        log('publisher left');
      }
    };

    videoWs.onclose = () => { setDot($('videoDot'), false); log('video signaling closed'); };
    videoWs.onerror = () => { log('video signaling error'); };
  }

  const pendingCandidates = [];

  async function drainCandidates() {
    while (pendingCandidates.length) {
      try { await pc.addIceCandidate(pendingCandidates.shift()); } catch (e) { log('flush ice', e.message); }
    }
  }

  function createPeerConnection() {
    pc = new RTCPeerConnection({
      iceServers: ICE_SERVERS(),
      bundlePolicy: 'max-bundle',
      rtcpMuxPolicy: 'require'
    });

    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    window.__dbgPc = pc;   // 调试：控制台可查 receiver 编码/抖动缓冲/码率

    // 优先 H.264：设备端走 VideoToolbox 硬编（AKUN 也是硬编 H.264），比 VP8 软编延迟低一大截。
    try {
      const tr = pc.getTransceivers()[0];
      const caps = (RTCRtpSender.getCapabilities('video') || {}).codecs || [];
      const h264 = caps.filter(c => /H264/i.test(c.mimeType));
      const rest = caps.filter(c => !/H264/i.test(c.mimeType));
      if (tr.setCodecPreferences && h264.length) tr.setCodecPreferences([...h264, ...rest]);
    } catch (e) { log('codec 偏好设置失败：' + e.message); }

    pc.ontrack = (ev) => {
      log('track', ev.track.kind);
      video.srcObject = ev.streams[0] || new MediaStream([ev.track]);
      stage.classList.remove('is-idle');
      video.play().catch(() => {});
      setDot($('videoDot'), true);
      // 局域网直连不需要抖动缓冲：压到 0，画面立刻上屏（默认缓冲会白加 100~300ms）
      try {
        if ('jitterBufferTarget' in ev.receiver) ev.receiver.jitterBufferTarget = 0;
        else if ('playoutDelayHint' in ev.receiver) ev.receiver.playoutDelayHint = 0;
      } catch (e) {}
    };

    pc.onicecandidate = (ev) => {
      if (ev.candidate && videoWs && videoWs.readyState === 1) {
        videoWs.send(JSON.stringify({ type: 'candidate', candidate: ev.candidate.candidate,
          sdpMid: ev.candidate.sdpMid, sdpMLineIndex: ev.candidate.sdpMLineIndex }));
      }
    };

    pc.onconnectionstatechange = () => {
      log('pc state', pc.connectionState);
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        setDot($('videoDot'), false);
      }
    };

    pc.oniceconnectionstatechange = () => log('ice', pc.iceConnectionState);
  }

  async function negotiate() {
    if (!pc) return;
    if (pc.signalingState !== 'stable') return;   // 已经有一个 offer 在飞
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      videoWs.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }));
    } catch (e) { log('offer 失败：' + e.message); }
  }

  function ICE_SERVERS() {
    // 纯打洞：只用实测可用的 VoIP 类 STUN（Google/Cloudflare 那类在这条线上不可用）。
    // 测于 2026-11-16：aebc / voipraider / epygi / voipcheap 四台均返回 EasyNAT。
    const turn = window.__TURN__ || null;
    const list = [
      { urls: 'stun:stun.voip.aebc.com:3478' },
      { urls: 'stun:stun.voipraider.com:3478' },
      { urls: 'stun:stun.epygi.com:3478' },
      { urls: 'stun:stun.voipcheap.com:3478' }
    ];
    if (turn) {
      list.push({
        urls: turn.urls,
        username: turn.username,
        credential: turn.credential
      });
    }
    return list;
  }

  /* ---------------- 控制：WebSocket 转发 ---------------- */
  let rttMs = null;   // 控制链路往返时延（网页↔中继↔设备），用来判断「点击迟钝」是不是链路问题

  function startControl(room) {
    ctrlWs = new WebSocket(WS_BASE + '/ws?room=ctrl-' + encodeURIComponent(room) + '&role=pc' + (AUTH_K ? '&k=' + encodeURIComponent(AUTH_K) : ''));

    ctrlWs.onopen = () => {
      setDot($('ctrlDot'), true);
      log('control open');
      // 每秒一次 ping，设备端原样回 pong，只测控制链路
      if (pingTimer) clearInterval(pingTimer);
      pingTimer = setInterval(() => ctrl({ t: 'ping', ts: Date.now() }), 1000);
    };
    ctrlWs.onclose = () => {
      setDot($('ctrlDot'), false);
      log('control closed');
      if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
    };
    ctrlWs.onmessage = (ev) => {
      let m = null;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m && m.t === 'pong' && m.ts) { rttMs = Date.now() - m.ts; return; }
      if (m && m.t === 'metrics') {
        const cap = m.cap || {}, rtc = m.rtc || {}, cfg = m.cfg || {};
        setV('dFps', (cap.fps != null ? cap.fps.toFixed(1) + ' fps' : '--')
             + (cap.w && cap.h ? ' · ' + cap.w + 'x' + cap.h : ''),
             (cap.fps || 0) >= Math.min(25, cfg.fps || 30) ? 'ok' : 'warn');
        setV('dRender', (cap.render != null ? cap.render.toFixed(1) : '--') + ' / '
             + (cap.scale != null ? cap.scale.toFixed(1) : '--') + ' ms'
             + '（合计 ' + (cap.cost != null ? cap.cost.toFixed(1) : '--') + ' / 预算 '
             + (cap.budget != null ? cap.budget.toFixed(1) : '--') + '）',
             (cap.cost != null && cap.budget != null && cap.cost > cap.budget * 1.15) ? 'bad' : 'ok');
        setV('dEnc', (rtc.encMs != null && rtc.encMs >= 0 ? rtc.encMs.toFixed(1) + ' ms' : '--'),
             (rtc.encMs > 15) ? 'warn' : '');
        setV('dUp', (rtc.uplink != null ? Math.round(rtc.uplink) + ' kbps' : '--')
             + ' 上限 ' + (rtc.cap != null ? Math.round(rtc.cap / 1000) + 'k' : '--'));
        setV('dCfg', (cfg.fps != null ? cfg.fps + 'fps' : '--') + ' / '
             + (cfg.scale != null ? cfg.scale.toFixed(2) : '--'));
        return;
      }
      if (m && m.t === 'auxResult') { onAuxResult(m); return; }
      log('ctrl recv', ev.data);
    };
  }

  function ctrl(payload) {
    if (ctrlWs && ctrlWs.readyState === 1) {
      ctrlWs.send(JSON.stringify(payload));
    }
  }
  window.__ctrlSend = ctrl;   // 调试用：控制台可直接 __ctrlSend({t:'hk',usage:233})

  /* ---------------- 触摸映射 ---------------- */
  function norm(ev) {
    const r = screenEl.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width;
    const y = (ev.clientY - r.top) / r.height;
    return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
  }

  let dragging = false;
  let pressStart = null;          // 按下时的归一化坐标 + 时间
  const DRAG_THRESHOLD = 0.006;   // 归一化位移超过它才算拖动
  let lastTap = null;             // 上一次点击（用于把两次单击合并成系统双击）
  const DOUBLE_TAP_MS = 300;      // 两次点击间隔在这个范围内就算双击
  const DOUBLE_TAP_DIST = 0.04;   // 且落点要接近

  screenEl.addEventListener('pointerdown', (ev) => {
    if (!ctrlWs || ctrlWs.readyState !== 1) return;
    // 只有左键（或触摸）才是「点击」；右键/中键一律交给 contextmenu 处理。
    // 不加这行的话，右键按下会在光标处发一次按下+抬起（凭空点一下），再发 home，两件事一起发生。
    if (ev.pointerType === 'mouse' && ev.button !== 0) { pressStart = null; dragging = false; return; }
    try { screenEl.setPointerCapture(ev.pointerId); } catch (e) {}
    dragging = false;
    const p = norm(ev);
    const nowMs = performance.now();
    const isDouble = lastTap && (nowMs - lastTap.t) < DOUBLE_TAP_MS
      && Math.abs(p.x - lastTap.x) < DOUBLE_TAP_DIST && Math.abs(p.y - lastTap.y) < DOUBLE_TAP_DIST;
    pressStart = { x: p.x, y: p.y, t: nowMs, dbl: isDouble };
    startTapProbe();   // 记录此刻画面，等它真的变了就把差值算成「跟手延迟」
    if (isDouble) {
      // 双击交给系统识别（设备端用 AKUN 的 0.15s 双击间隔），比两次独立单击可靠
      lastTap = null;
      ctrl({ t: 'dtap', x: p.x, y: p.y });
      return;
    }
    // 按下就立刻把 touchDown 发下去：点按的起手延迟不再依赖松手时刻（AKUN 的 ptrAddEvent 也是这样）
    ctrl({ t: 'd', x: p.x, y: p.y });
  });

  screenEl.addEventListener('pointermove', (ev) => {
    if (!pressStart) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0 && ev.buttons !== 1) return;
    const now = performance.now();
    if (now - lastMoveSent < 33) return;   // 与设备 30fps 抓屏对齐：发得比屏幕更新还快只会堆在注入队列里
    const p = norm(ev);
    if (!dragging) {
      const dx = Math.abs(p.x - pressStart.x);
      const dy = Math.abs(p.y - pressStart.y);
      if (dx < DRAG_THRESHOLD && dy < DRAG_THRESHOLD) return;   // 还没动够，先不发
      dragging = true;
    }
    lastMoveSent = now;
    ctrl({ t: 'm', x: p.x, y: p.y });
  });

  function endDrag(ev) {
    if (!pressStart) return;
    if (pressStart.dbl) { pressStart = null; dragging = false; return; }   // 双击：抬起已经由设备端补发
    const p = norm(ev);
    const dt = performance.now() - pressStart.t;
    // 收尾统一发抬起；设备端会兜住最短按住时长（太短的按压 SpringBoard 不认）
    ctrl({ t: 'u', x: dragging ? p.x : pressStart.x, y: dragging ? p.y : pressStart.y });
    // 以前这里有「按住 450ms 松手就回桌面」，真机上点慢一点就会莫名回桌面 —— 已删除。
    // 回桌面改用右键 / Esc（下面 contextmenu 与 keydown 都有），长按就老老实实长按，交给 iOS 自己弹菜单
    if (!dragging) lastTap = { t: performance.now(), x: pressStart.x, y: pressStart.y };
    pressStart = null;
    dragging = false;
  }

  screenEl.addEventListener('pointerup', endDrag);
  screenEl.addEventListener('pointercancel', endDrag);

  // 右键 / 长按 → Home 键
  screenEl.addEventListener('contextmenu', (ev) => {
    ev.preventDefault();
    lastTap = null;          // 右键之后第一下左键必须当单击，不能和右键前那次点击拼成双击
    pressStart = null;
    dragging = false;
    ctrl({ t: 'k', code: 'home' });   // 与 AKUN 一致：右键 = 返回桌面
  });

  window.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { ctrl({ t: 'k', code: 'home' }); }
    if (ev.key === 'ArrowUp') { ctrl({ t: 'k', code: 'volumeUp' }); }
    if (ev.key === 'ArrowDown') { ctrl({ t: 'k', code: 'volumeDown' }); }
  });

  /* ---------------- FPS 统计（按真实解码帧计数，不是屏幕刷新率） ---------------- */
  let frames = 0, framesTotal = 0, lastTs = performance.now();
  // 首帧耗时：从页面脚本开始跑到第一帧真正呈现。这就是「打开窗口多久出画」，
  // 对标 AKUN 的 200~300ms；这里直接上报到 /api/client，不用靠肉眼猜。
  const tPage0 = performance.now();
  let firstFrameMs = -1;
  let lastFrameAt = 0, gapMax = 0, gapMaxAt = 0;
  // 每个页面一个短 id：日志里两个窗口同时上报时不会再互相污染（之前就踩过这个坑）
  const TABID = Math.random().toString(36).slice(2, 6);
  const IN_APP = /Doubao|MicroMessenger|aweme|ByteDance/i.test(navigator.userAgent);
  // 卡屏自救：画面可见却 1.5 秒没新帧 → 自己跟服务端要一次关键帧，
  // 服务端再喊手机立刻抓一帧。这样偶发的解码断链能自己爬起来，不用等人切窗口。
  let kfAt = 0;
  setInterval(() => {
    if (document.visibilityState !== 'visible') { return; }
    const now = performance.now();
    // 两种情况都要自救：① 出过帧但卡住 1.5s；② 建连 3s 还一帧都没出（开窗一直黑）。
    const stalled = lastFrameAt > 0 ? (now - lastFrameAt > 1500)
                                    : (framesTotal === 0 && now - tPage0 > 3000);
    if (stalled && now - kfAt > 1500) {
      kfAt = now;
      try {
        if (videoWs && videoWs.readyState === 1) {
          videoWs.send(JSON.stringify({ type: 'keyframe' }));
        }
      } catch (e) {}
    }
  }, 500);
  function onVF() {
    frames++; framesTotal++;
    if (firstFrameMs < 0) {
      firstFrameMs = Math.round(performance.now() - tPage0);
      setV('hFF', firstFrameMs + ' ms', firstFrameMs > 800 ? 'bad' : (firstFrameMs > 400 ? 'warn' : 'ok'));
    }
    // 跟手探针：新的一帧真的呈现出来了 → 记下这一帧的延迟。
    // 这里用「已呈现帧数」判断，不再对 video 做 drawImage —— 软件解码的浏览器里
    // 每次 drawImage+getImageData 要几十毫秒，它自己就会把画面和延迟一起拖垮。
    if (tapMeasuring && framesTotal !== tapFrames0) {
      tapMeasuring = false;
      const ms = Math.round(performance.now() - tapT0);
      tapHits.push(ms); if (tapHits.length > 10) tapHits.shift();
      const avg = Math.round(tapHits.reduce((a, b) => a + b, 0) / tapHits.length);
      setV('hTap', ms + ' ms（均 ' + avg + '）', ms > 250 ? 'bad' : (ms > 150 ? 'warn' : 'ok'));
      $('hTapLog').textContent = '近 ' + tapHits.length + ' 次：' + tapHits.join(' / ') + ' ms';
    }
    const now = performance.now();
    // 「突然卡屏」的量化：相邻两帧呈现的间隔。静止画面本来就 1 帧/2 秒，
    // 所以判卡不能只看间隔，要配合「页面可见 + 之前 1 秒内有连续帧」。
    if (lastFrameAt > 0) {
      const gap = now - lastFrameAt;
      if (gap > gapMax) { gapMax = gap; }
    }
    lastFrameAt = now;
    if (now - lastTs >= 1000) {
      $('fps').textContent = frames + ' fps';
      frames = 0; lastTs = now;
    }
    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(onVF);
  }
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(onVF);
  else setInterval(() => { $('fps').textContent = '--'; }, 2000);

  /* ---------------- 链路指标全量采集 ---------------- */
  let lastBytes = 0, lastStatTs = 0, rttFromPair = null;
  function setV(id, text, cls) {
    const el = $(id); if (!el) return;
    el.textContent = text;
    el.className = 'v' + (cls ? ' ' + cls : '');
  }
  setInterval(async () => {
    if (!pc || !pc.getStats) return;
    try {
      const stats = await pc.getStats();
      let inb = null, pair = null;
      stats.forEach(r => {
        if (r.type === 'inbound-rtp' && r.kind === 'video') inb = r;
        if (r.type === 'candidate-pair' && (r.selected || r.state === 'succeeded')) {
          if (r.currentRoundTripTime != null) pair = r;
        }
      });
      if (pair && pair.currentRoundTripTime != null) rttFromPair = Math.round(pair.currentRoundTripTime * 1000);
      if (!inb) return;

      const now = inb.timestamp || performance.now();
      const dt = lastStatTs ? (now - lastStatTs) / 1000 : 0;
      const kbps = dt > 0 ? ((inb.bytesReceived - lastBytes) * 8 / 1000 / dt) : 0;
      lastBytes = inb.bytesReceived; lastStatTs = now;

      const w = inb.frameWidth || 0, h = inb.frameHeight || 0;
      const lost = inb.packetsLost || 0;
      const recv = inb.packetsReceived || 0;
      const lostPct = (lost + recv) > 0 ? (lost / (lost + recv) * 100) : 0;
      const jit = inb.jitter != null ? Math.round(inb.jitter * 1000) : null;
      const bufMs = (inb.jitterBufferDelay != null && inb.jitterBufferEmittedCount)
        ? Math.round(inb.jitterBufferDelay / inb.jitterBufferEmittedCount * 1000) : null;
      const decMs = (inb.totalDecodeTime != null && inb.framesDecoded)
        ? (inb.totalDecodeTime / inb.framesDecoded * 1000) : null;
      const rtt = rttFromPair != null ? rttFromPair : rttMs;

      setV('hRes', w && h ? (w + 'x' + h) : '--');
      setV('hFps', inb.framesPerSecond != null ? (inb.framesPerSecond + ' fps') : '--',
           inb.framesPerSecond >= 25 ? 'ok' : (inb.framesPerSecond >= 15 ? 'warn' : 'bad'));
      setV('hKbps', Math.round(kbps) + ' kbps');
      setV('hLost', lost + (lostPct > 0.001 ? '（' + lostPct.toFixed(1) + '%）' : '') + ' pkt',
           lostPct > 3 ? 'bad' : (lostPct > 1 ? 'warn' : 'ok'));
      setV('hJit', jit != null ? jit + ' ms' : '--', jit > 60 ? 'warn' : '');
      setV('hBuf', bufMs != null ? bufMs + ' ms' : '--', bufMs > 100 ? 'warn' : 'ok');
      setV('hDec', decMs != null ? decMs.toFixed(1) + ' ms/帧' : '--', decMs > 20 ? 'warn' : '');
      setV('hFreeze', (inb.framesDropped || 0) + ' 丢 / ' + (inb.freezeCount || 0) + ' 冻'
           + ((inb.totalFreezesDuration || 0) > 0.5 ? '（冻 ' + (inb.totalFreezesDuration).toFixed(1) + 's）' : ''),
           (inb.freezeCount || 0) > 0 ? 'warn' : 'ok');
      setV('hNack', (inb.nackCount || 0) + ' / PLI ' + (inb.pliCount || 0));
      setV('hRtt', rtt != null ? rtt + ' ms' : '--', rtt > 150 ? 'bad' : (rtt > 60 ? 'warn' : 'ok'));

      const line = `${w}x${h} ${Math.round(kbps)}kbps 丢${lost}${rtt != null ? ' 延迟' + rtt + 'ms' : ''}`;
      $('stat').textContent = line;

      // 落盘：一行 JSON，服务端写 clientstats.log，排障时直接读日志
      try {
        fetch('/api/client', { method: 'POST', keepalive: true,
          body: JSON.stringify({
            room: ($('room').value || '').trim(),
            res: w + 'x' + h, fps: inb.framesPerSecond || 0, kbps: Math.round(kbps),
            lost: lost, lostPct: +lostPct.toFixed(2), jitter: jit, buf: bufMs, dec: decMs,
            drop: inb.framesDropped || 0, freeze: inb.freezeCount || 0,
            nack: inb.nackCount || 0, pli: inb.pliCount || 0, rtt: rtt,
            tapMs: tapHits.length ? tapHits[tapHits.length - 1] : null, ff: firstFrameMs,
            gapMax: Math.round(gapMax), tab: TABID, vis: document.visibilityState, inapp: IN_APP
          }) });
        // 每秒清零：否则 HUD 显示的是「页面打开以来的最长间隔」，不是当前状态
        gapMax = 0;
      } catch (e) {}
    } catch (e) {}
  }, 1000);

  /* ---------------- 跟手实测：点击那一刻 → 画面真的变了 ---------------- */
  // 跟手实测：只记「点击那一刻已呈现多少帧」，之后等 onVF 报来新帧即可。
  // 全程零 canvas 采样 → 测量本身不占 CPU、不干扰画面。
  let tapT0 = 0, tapFrames0 = 0, tapMeasuring = false, tapHits = [];
  let tapTimeout = 0;

  function startTapProbe() {
    tapFrames0 = framesTotal;
    tapT0 = performance.now();
    tapMeasuring = true;
    clearTimeout(tapTimeout);
    tapTimeout = setTimeout(() => {
      if (!tapMeasuring) return;
      tapMeasuring = false;
      $('hTapLog').textContent = '这一次画面没变（点的地方可能本来就没变化）';
    }, 2000);
  }


  /* ---------------- 辅助功能（对标 AKUN 的 19940 动作集） ---------------- */
  let auxSeq = 0;
  function auxSend(a, extra) {
    const id = ++auxSeq;
    ctrl(Object.assign({ t: 'aux', a: a, id: id }, extra || {}));
    setAuxOut('已发送 ' + a + (extra && extra.text ? '：' + extra.text : ''));
    return id;
  }
  function setAuxOut(html) { $('auxOut').innerHTML = html; }

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function onAuxResult(m) {
    const a = m.a;
    if (m.success === false) { setAuxOut('<span class="bad">' + esc(a) + ' 失败：' + esc(m.error || '未知') + '</span>'); return; }
    if (a === 'list_apps') {
      const apps = m.apps || [];
      setAuxOut('<div class="muted">已安装 ' + (m.count || apps.length) + ' 个（显示前 60 个）</div>'
        + apps.slice(0, 60).map(A =>
          '<div class="app"><span>' + esc(A.name) + '<br><span class="muted" style="font-size:11px">' + esc(A.bundle) + '</span></span>'
          + '<button onclick="__auxLaunch(\'' + esc(A.bundle) + '\')">启动</button>'
          + '<button onclick="__auxKill(\'' + esc(A.bundle) + '\')">关闭</button></div>').join(''));
      return;
    }
    if (a === 'get_clipboard') { setAuxOut('剪贴板：<b>' + esc(m.text || '（空）') + '</b>'); return; }
    if (a === 'device_info') {
      setAuxOut('<div>型号 ' + esc(m.model) + ' · iOS ' + esc(m.system_version) + '</div>'
        + '<div class="muted">' + esc(m.udid) + '</div><div class="muted">deb ' + esc(m.version) + '</div>');
      return;
    }
    if (a === 'find_app') {
      setAuxOut(m.name ? ('找到：<b>' + esc(m.name) + '</b><br><span class="muted">' + esc(m.bid) + '</span> '
        + '<button onclick="__auxLaunch(\'' + esc(m.bid) + '\')">启动</button>') : '没找到');
      return;
    }
    setAuxOut('<span class="ok">' + esc(a) + ' 完成</span>' + (m.text ? '：' + esc(m.text) : ''));
  }
  window.__auxKey = (k) => { auxSend('key', { code: k }); };

  // 键盘直通：#kbPad 里敲一个字符就发一条 key，和 AKUN 的逐键通道一致。
  // 需要 Shift 的符号由设备端自动补 Shift；中文/表情无法映射成 HID usage，
  // 走 composition 结束后整体 input_text（剪贴板 + Cmd+V）。
  const KB_NAMED = { Enter: 'enter', Backspace: 'backspace', Escape: 'escape', Tab: 'tab',
                     Delete: 'delete', ArrowUp: 'up', ArrowDown: 'down',
                     ArrowLeft: 'left', ArrowRight: 'right' };
  (function initKbPad() {
    const pad = document.getElementById('kbPad');
    if (!pad) return;
    pad.addEventListener('keydown', (ev) => {
      if (ev.isComposing) return;                       // 中文输入中，交给 compositionend
      const named = KB_NAMED[ev.key];
      if (named) { ev.preventDefault(); auxSend('key', { code: named }); return; }
      if (ev.key === ' ') { ev.preventDefault(); auxSend('key', { code: 'space' }); return; }
      if (ev.key.length === 1 && ev.key.charCodeAt(0) < 128) {
        ev.preventDefault();
        auxSend('key', { char: ev.key });
      }
    });
    pad.addEventListener('compositionend', (ev) => {
      const t = ev.data || '';
      if (t) auxSend('input_text', { text: t });
    });
    const clear = document.getElementById('kbClear');
    if (clear) clear.onclick = () => { pad.value = ''; pad.focus(); };
  })();
  /* 全局键盘直通：不点任何输入框，鼠标停在画面上直接敲键盘就发到手机。
     规则（对齐 AKUN「可在画面上直接打字」）：
       - 可编辑元素（#kbPad、房间号输入框）里的按键照旧走它们自己的逻辑；
       - Esc 保留「回桌面」，↑↓ 保留音量快捷键，其余具名键原样发给手机；
       - 字母数字符号逐键发 key，按住 Cmd/Ctrl 时带 gui:true（Cmd+C/Cmd+V 之类）；
       - 中文/表情走隐藏 sink 的 compositionend → input_text。 */
  (function initKbGlobal() {
    if (!document.body) return;
    const sink = document.createElement('input');
    sink.id = 'kbSink';
    sink.setAttribute('autocomplete', 'off');
    sink.setAttribute('autocorrect', 'off');
    sink.setAttribute('autocapitalize', 'off');
    sink.setAttribute('spellcheck', 'false');
    sink.style.cssText = 'position:fixed;left:-300px;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;';
    document.body.appendChild(sink);

    sink.addEventListener('compositionend', (ev) => {
      const t = ev.data || '';
      sink.value = '';
      if (t) auxSend('input_text', { text: t });
    });

    const PASS_TAGS = { INPUT: 1, TEXTAREA: 1, SELECT: 1 };
    function isEditable(el) {
      if (!el) return false;
      if (PASS_TAGS[el.tagName]) return true;
      if (el.isContentEditable) return true;
      return false;
    }
    // 这两个键留给页面自己的快捷键（音量），不发给手机
    const PAGE_OWNS = { Escape: 1, ArrowUp: 1, ArrowDown: 1 };
    const SKIP = { Shift: 1, Meta: 1, Control: 1, Alt: 1, CapsLock: 1, F1: 1, F2: 1, F3: 1,
                   F4: 1, F5: 1, F6: 1, F7: 1, F8: 1, F9: 1, F10: 1, F11: 1, F12: 1 };

    let guiDown = false;

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Meta' || ev.key === 'Control') { guiDown = true; return; }
      if (isEditable(ev.target)) return;              // #kbPad / 房间号输入框：它们自己处理
      if (ev.isComposing) return;                     // 中文输入中：交给 compositionend
      if (SKIP[ev.key]) return;
      if (PAGE_OWNS[ev.key]) return;

      const named = KB_NAMED[ev.key];
      if (named) {
        ev.preventDefault();
        auxSend('key', guiDown ? { code: named, gui: true } : { code: named });
        return;
      }
      if (ev.key === ' ') { ev.preventDefault(); auxSend('key', { code: 'space' }); return; }
      if (ev.key.length !== 1) return;                // Insert/PageUp 之类忽略
      if (ev.key.charCodeAt(0) >= 128) return;        // 非 ASCII 单字符交给输入法
      ev.preventDefault();
      if (guiDown) auxSend('key', { char: ev.key.toLowerCase(), gui: true });
      else auxSend('key', { char: ev.key });
    }, true);

    document.addEventListener('keyup', (ev) => {
      if (ev.key === 'Meta' || ev.key === 'Control') guiDown = false;
    }, true);
    window.addEventListener('blur', () => { guiDown = false; });

    // 点画面就把焦点交给隐藏 sink，中文输入法才有落点；点输入框时不抢
    const cv = document.getElementById('rawCanvas') || document.querySelector('canvas') || document.body;
    if (cv) {
      cv.setAttribute('tabindex', '0');
      cv.addEventListener('pointerdown', () => {
        try { sink.focus({ preventScroll: true }); } catch (e) { sink.focus(); }
      }, true);
    }
  })();

  window.__auxLaunch = (b) => { auxSend('launch_app', { bundle: b }); };
  window.__auxKill = (b) => { auxSend('kill_app', { bundle: b }); };

  $('auxBtn').onclick = () => $('aux').classList.toggle('hide');
  $('auxClose').onclick = () => $('aux').classList.add('hide');
  document.querySelectorAll('#aux [data-aux]').forEach(b => {
    b.onclick = () => auxSend(b.getAttribute('data-aux'));
  });
  $('auxSendText').onclick = () => {
    const t = $('auxText').value;
    if (!t) { setAuxOut('先填文字'); return; }
    auxSend('input_text', { text: t });
  };
  $('auxOpen').onclick = () => {
    const v = ($('auxTarget').value || '').trim();
    if (!v) { setAuxOut('先填网址或 BundleID'); return; }
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)) auxSend('open_url', { url: v });
    else auxSend('launch_app', { bundle: v });
  };
  $('auxApps').onclick = () => auxSend('list_apps');
  $('auxClip').onclick = () => auxSend('get_clipboard');

  /* ---------------- 面板开关 ---------------- */
  function toggleHud() { $('hud').classList.toggle('hide'); }
  $('hudBtn').onclick = toggleHud;
  window.addEventListener('keydown', (ev) => {
    if (ev.key === 'D') toggleHud();   // 只认大写：小写 d 让给手机当打字用
  });

  /* ---------------- 按钮 ---------------- */
  $('connect').onclick = () => {
    const room = ($('room').value || 'dev001').trim();
    stopAll();
    startVideoAuto(room);
    startControl(room);
  };

  $('disconnect').onclick = stopAll;

  /* ---------------- 外部内嵌支持：?room=xxx&auto=1 ---------------- */
  // 客户端（云控客户端）把这一页嵌进 WebView 时，用 URL 参数指定设备并自动连上，
  // 省掉手动输 room、点连接的步骤。auto=1 只自动点一次，之后由页面自己的重连逻辑接管。
  (function () {
    const q = new URLSearchParams(location.search);
    const qRoom = (q.get('room') || '').trim();
    if (qRoom) { $('room').value = qRoom; }
    if (q.get('hidehud') === '1') { $('hud').classList.add('hide'); }
    if (q.get('auto') === '1' && qRoom) {
      setTimeout(() => { try { $('connect').click(); } catch (e) { log('自动连接失败', e.message); } }, 200);
    }
  })();

  // 画质档位：直接打设备端配置接口，设备收到后立即重建编码参数，不重装、不断流
  $('quality').onchange = async (ev) => {
    const room = ($('room').value || 'dev001').trim();
    const [scale, fps, bitrate, cap] = ev.target.value.split(',');
    try {
      const r = await fetch(`/api/config?room=${encodeURIComponent(room)}&scale=${scale}&fps=${fps}&bitrate=${bitrate}`
        + (cap ? `&cap=${cap}` : ''));
      const j = await r.json();
      log('画质下发', j.payload, '设备数', j.sent);
      if (!j.sent) $('stat').textContent = '设备未连控制通道，档位没下发';
    } catch (e) { log('画质下发失败', e.message); }
  };

  // 按「模式 + 台数 + 上行」自动换算档位并下发（授权时用低清档，中控回默认档）
  $('applyPreset').onclick = async () => {
    const room = ($('room').value || 'dev001').trim();
    const mode = $('mode').value;
    const devs = $('devs').value;
    const up = $('uplink').value || '50';
    try {
      const r = await fetch(`/api/preset?room=${encodeURIComponent(room)}&mode=${mode}`
        + `&devices=${devs}&uplink=${up}&apply=1`);
      const j = await r.json();
      $('presetInfo').textContent = `每台 ${j.perDev}kbps · 上限 ${Math.round(j.cap/1000)}k`
        + ` · ${j.scale} / ${j.fps}fps · 已下发 ${j.sent} 台`;
      log('档位下发', j.payload);
      if (!j.sent) $('stat').textContent = '设备未连控制通道，档位没下发';
    } catch (e) { log('档位换算失败', e.message); }
  };

  function stopAll() {
    stopRawVideo();
    if (videoRetry) { clearInterval(videoRetry); videoRetry = null; }
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
    try { pc && pc.close(); } catch (e) {}
    pc = null;
    if (videoWs) { videoWs.onclose = null; videoWs.close(); videoWs = null; }
    if (ctrlWs) { ctrlWs.onclose = null; ctrlWs.close(); ctrlWs = null; }
    video.srcObject = null;
    stage.classList.add('is-idle');
    setDot($('videoDot'), false);
    setDot($('ctrlDot'), false);
    $('peers').textContent = '';
  }

  // 自动连一次
  $('connect').click();
})();
</script>
</body>
</html>
