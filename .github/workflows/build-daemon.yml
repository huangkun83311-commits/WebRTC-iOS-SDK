name: Build daemon packages (deb + tipa)

on:
  push:
    branches: [master, main]
    paths:
      - "bridge/daemon/**"
      - "bridge/server/**"
      - ".github/workflows/build-daemon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 原来跑 macos-latest：GitHub 免费 macOS arm64 runner 常年排队，15 分钟拿不到机器直接判 failed
    # （日志原文 "The job was not acquired by Runner of type hosted even after multiple attempts"）。
    # theos 在 Linux 上同样能出 arm64 deb 与 tipa（本地已实测跑通），换 ubuntu-latest 绕开排队。
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling (Linux)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm-14 \
            dpkg dpkg-dev xz-utils zip unzip \
            libssl-dev libplist-dev
          # libplist 在 22.04 叫 libplist3、24.04 起改叫 libplist-2.0-3（提供同一个 soname
          # libplist-2.0.so.3），写成 fallback，避免 runner 换版本时 apt 直接 exit 100
          sudo apt-get install -y --no-install-recommends libplist3 \
            || sudo apt-get install -y --no-install-recommends libplist-2.0-3
          clang --version | head -1
          ldconfig -p | grep libplist | head -2

      - name: Set up Go (服务端交叉编译)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Theos + SDK (Linux 工具链)
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks /tmp/theos-sdks
          cd /tmp/theos-sdks && git sparse-checkout set iPhoneOS16.5.sdk
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          # theos 仓库不自带 Linux 交叉工具链，按约定在 toolchain/linux/iphone/bin 建软链指向系统工具
          mkdir -p "$THEOS/toolchain/linux/iphone/bin"
          BIN="$THEOS/toolchain/linux/iphone/bin"
          ln -sf "$(command -v clang)"   "$BIN/clang"
          ln -sf "$(command -v clang++)" "$BIN/clang++"
          # ar/nm/strip/ranlib 必须是 LLVM 版：GNU binutils 不认识 arm64 Mach-O，
          # 会直接报 "file format not recognized" 把 make 打断（上一版 CI 就死在这）
          ln -sf "$(command -v llvm-ar-14     || command -v llvm-ar)"     "$BIN/ar"
          ln -sf "$(command -v llvm-nm-14     || command -v llvm-nm)"     "$BIN/nm"
          ln -sf "$(command -v llvm-strip-14  || command -v llvm-strip)"  "$BIN/strip"
          ln -sf "$(command -v llvm-ranlib-14 || command -v llvm-ranlib)" "$BIN/ranlib"
          ln -sf "$(command -v ld.lld)" "$BIN/ld"
          ln -sf "$(command -v ld.lld)" "$BIN/ld.lld"
          ls -l "$BIN"
          # theos 仓库里没有 bin/ldid（上一版 CI 就死在 `ls $THEOS/bin/ldid` 这一行，
          # ls 找不到文件退出码正好是 2，跟报的 exit code 2 对得上）。Linux 版只能自己编。
          git clone --depth 1 --recursive https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src
          ( cd /tmp/ldid-src && make -j"$(nproc)" )
          mkdir -p "$THEOS/bin"
          cp /tmp/ldid-src/ldid "$THEOS/bin/ldid"
          chmod +x "$THEOS/bin/ldid"
          "$THEOS/bin/ldid" 2>&1 | head -1
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls "$THEOS/sdks"

      - name: Build deb
        run: |
          set -o pipefail
          bash bridge/daemon/build-deb.sh 2>&1 | tee /tmp/deb.log

      - name: Build tipa
        run: |
          set -o pipefail
          bash bridge/daemon/build-tipa.sh 2>&1 | tee /tmp/tipa.log

      - name: Build signaling server (Go, 多平台)
        run: |
          set -o pipefail
          cd bridge/server
          export GOFLAGS=-mod=mod
          go mod tidy
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../daemon/packages/bridge-server-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../daemon/packages/bridge-server-linux-amd64 . 2>&1 | tee /tmp/server.log
          ls -l ../daemon/packages/

      - name: Collect packages and write summary
        id: collect
        run: |
          set -e
          mkdir -p out
          shopt -s nullglob
          for f in bridge/daemon/packages/*.deb bridge/daemon/packages/*.tipa bridge/daemon/packages/bridge-server-*; do
            cp "$f" out/
          done
          ls -l out
          {
            echo "## 本次产物"
            echo ""
            echo "| 文件 | 大小 | sha256 |"
            echo "|---|---|---|"
            for f in out/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "count=$(ls out | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Surface compiler errors as annotations
        if: failure()
        run: |
          for f in /tmp/deb.log /tmp/tipa.log; do
            [ -f "$f" ] || continue
            grep -nE "error|Error|fatal|No such file|not found|undefined|Error 1|Error 2|dm\.pl" "$f" | head -40 | while IFS= read -r line; do
              echo "::error ::$line"
            done
            echo "::error ::---- tail of $(basename $f) ----"
            tail -25 "$f" | while IFS= read -r line; do
              echo "::error ::$line"
            done
          done

      - name: 上传编译日志（失败时，公开可下载）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/logs
          for f in /tmp/deb.log /tmp/tipa.log /tmp/server.log; do
            [ -f "$f" ] && cp "$f" /tmp/logs/ || true
          done
          ls -l /tmp/logs || true
          for f in /tmp/logs/*; do
            tail -c 200000 "$f" > "$f.tail" && mv "$f.tail" "$f"
            gh release upload daemon-latest "$f" --clobber --repo "$GITHUB_REPOSITORY" \
              && echo "已上传 $(basename $f)" || echo "上传失败 $(basename $f)"
          done

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akun-bridge-deb
          path: out/*.deb
          if-no-files-found: error

      - name: Upload tipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akun-bridge-tipa
          path: out/*.tipa
          if-no-files-found: error

      - name: Delete stale release assets
        if: success()
        run: |
          set +e
          for f in out/*; do
            n=$(basename "$f")
            gh release delete-asset daemon-latest "$n" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null && \
              echo "已删除旧资产 $n" || echo "旧资产 $n 不存在（跳过）"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to release (public download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daemon-latest
          name: "AKUN WebRTC Bridge (latest build)"
          body: |
            由 GitHub Actions 自动构建（${{ github.sha }}）。
            - `*.deb`：Dopamine / rootless 直接安装
            - `*.tipa`：TrollStore 安装
            - `bridge-server-windows-amd64.exe` / `bridge-server-linux-amd64`：信令+SFU 中继服务端（手机只推一路，多人观看不卡）
          files: out/*
          prerelease: true
