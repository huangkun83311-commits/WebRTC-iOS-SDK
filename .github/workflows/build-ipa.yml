name: Build IPA (TrollStore / 免签可用)

# 说明：
# 这台流水线在 GitHub 的 macOS runner 上编译，产出未授权签名的 IPA，
# 供 TrollStore(巨魔) 或自签工具安装到真机。
# 若填写了 server_url / stream_id，会写进 ScreenShare 扩展的 Info.plist，
# 这样即使 App Group 容器不可用（无正式开发者证书时常见），屏幕共享扩展也能正常推流。

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      server_url:
        description: '信令地址，例如 ws://1.2.3.4:8080（留空则用 App 里填的）'
        required: false
        default: ''
      stream_id:
        description: '设备 ID，例如 dev001'
        required: false
        default: ''

jobs:
  build:
    # 不指定 Xcode 版本：runner 镜像自带的就是当前可用的最新版。
    # 之前写死 16.4 会直接失败（runner 上只剩 26.x）。
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive（不签名）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project WebRTCiOSSDK.xcodeproj \
            -scheme "WebRTC-Sample-App" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 120

      # 编译失败时，把编译器报错原样打成 GitHub 注解（注解在 run 页面上公开可见，
      # 这样不用 token 也能定位到具体文件和行号）。
      - name: 编译失败时输出可读的报错注解
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || { echo "::error ::没有找到 build.log"; exit 0; }
          echo "===== grep error ====="
          grep -E "(^|: )(error|fatal error): " "$LOG" | head -n 30 || true
          echo "===== 结束 ====="
          grep -E "(^|: )(error|fatal error): " "$LOG" | head -n 30 | while IFS= read -r line; do
            echo "::error ::${line}"
          done

      - name: 注入备用配置到扩展 Info.plist
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
          STREAM_ID: ${{ github.event.inputs.stream_id }}
        run: |
          set -euo pipefail
          APPEX=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 3 -name "*.appex" | head -n 1)
          echo "APPEX=$APPEX"
          if [ -z "${SERVER_URL}" ] && [ -z "${STREAM_ID}" ]; then
            echo "未提供 server_url/stream_id，跳过注入"
            exit 0
          fi
          PLIST="$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :WebRTCServerURL" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :WebRTCStreamId" "$PLIST" || true
          [ -n "${SERVER_URL}" ] && /usr/libexec/PlistBuddy -c "Add :WebRTCServerURL string ${SERVER_URL}" "$PLIST"
          [ -n "${STREAM_ID}" ] && /usr/libexec/PlistBuddy -c "Add :WebRTCStreamId string ${STREAM_ID}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | head -n 40

      - name: Ad-hoc 签名（保留 App Group entitlements）
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          APPEX=$(find "$APP/PlugIns" -maxdepth 1 -name "*.appex" | head -n 1)
          echo "APP=$APP"
          echo "APPEX=$APPEX"
          if [ -n "$APPEX" ]; then
            codesign --force --sign - --timestamp=none \
              --entitlements "ScreenShare/ScreenShare.entitlements" "$APPEX"
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements "WebRTC-Sample-App/WebRTC-Sample-App.entitlements" "$APP"
          codesign -d --entitlements - "$APP" || true
          codesign -v "$APP" || true

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/WebRTC-Device-Bridge.ipa" Payload
          ls -lh "$RUNNER_TEMP/WebRTC-Device-Bridge.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebRTC-Device-Bridge-ipa
          path: ${{ runner.temp }}/WebRTC-Device-Bridge.ipa
          if-no-files-found: error
