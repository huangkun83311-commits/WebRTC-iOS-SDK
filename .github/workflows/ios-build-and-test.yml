name: iOS Build and Test

# 原版写死 Xcode 16.4，GitHub runner 上已经没有这个版本了（只剩 26.x），
# 所以之前每次 push 第一步就失败。这里改成用 runner 自带的 Xcode，
# 模拟器测试也改成 generic 目标，不再依赖某个具体机型是否存在。

on: push

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build WebRTCiOSSDK
      run: xcodebuild -scheme WebRTCiOSSDK -configuration Release -destination "generic/platform=iOS" ARCHS=arm64 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

    - name: Compile tests (simulator, generic destination)
      run: xcodebuild build-for-testing -scheme WebRTCiOSSDK -destination "generic/platform=iOS Simulator" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Build WebRTCSampleApp
      run: |
        set -o pipefail
        xcodebuild -scheme WebRTC-Sample-App -configuration Release -destination "generic/platform=iOS" ARCHS=arm64 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build \
          2>&1 | tee "$RUNNER_TEMP/app-build.log" | tail -n 120

    # 把编译错误打成公开可见的注解，方便定位到文件和行号
    - name: 编译失败时输出可读的报错注解
      if: failure()
      run: |
        LOG="$RUNNER_TEMP/app-build.log"
        [ -f "$LOG" ] || exit 0
        grep -E "(^|: )(error|fatal error): " "$LOG" | head -n 30 | while IFS= read -r line; do
          echo "::error ::${line}"
        done
